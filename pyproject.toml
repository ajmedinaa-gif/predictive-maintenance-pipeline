[project]
name = "predictive-maintenance-pipeline"
version = "0.1.0"
description = "Mantenimiento predictivo industrial: pipeline reproducible con validación honesta bajo desbalance de clases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ajmedinaa-gif" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    # shap arrastra numba -> llvmlite. A partir de numba 0.63 / llvmlite 0.46 ya
    # no se publica rueda `macosx_*_x86_64`: en el Mac Intel de desarrollo, una
    # versión anterior de shap hace que `uv sync` compile LLVM desde fuente
    # (CLAUDE.md §14.2). shap >= 0.52 declara ese tope él mismo, condicionado a
    # la plataforma, así que CI (Linux) sigue resolviendo lo último.
    "shap>=0.45,<0.52",
    "numba>=0.62,<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite>=0.45,<0.46; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "streamlit>=1.36",
    "ucimlrepo>=0.0.7",
]

[project.scripts]
pdm-cli = "predictive_maintenance.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_maintenance"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# tools/fase.py es una utilidad de la usuaria ajena al paquete: corre con el
# Python del sistema y no sigue el mismo estilo del código fuente.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pep8-naming]
# Convención universal de scikit-learn: `X` es la matriz de atributos, `y` el
# objetivo. Renombrarlas a minúsculas sería menos legible para cualquiera que
# conozca la convención, no más.
ignore-names = ["X", "X_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src"]
